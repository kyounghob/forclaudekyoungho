[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etfrec"
version = "1.0.0"
description = "ETF 교육 콘텐츠 개인화·세그먼트 추천 시스템 (수업 프로젝트)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26", "pydantic>=2.5",
]

[project.optional-dependencies]
neural = ["torch>=2.1"]
dev = ["pytest>=8.0"]

[project.scripts]
etfrec = "etfrec.cli:main"

[tool.setuptools.packages.find]
include = ["etfrec*"]

[tool.setuptools.package-data]
etfrec = ["ui/*", "sources/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
